version: '3'

x-app: &app
    #platform: linux/arm64/v8
    build:
        dockerfile: ./docker/app/Dockerfile
        context: ./
        args:
            UID: "${UID:-1000}"
            GID: "${GID:-1000}"
    image: djangobase
    env_file:
        - .env

    networks:
        - helios-network
    restart: "${DOCKER_RESTART_POLICY:-unless-stopped}"
    stop_grace_period: "${DOCKER_STOP_GRACE_PERIOD:-3s}"
    volumes:
        - ./.:/var/www/helios-server
        - logs_volume:/var/log/

x-celery: &celery
    <<: *app
    depends_on:
        - redis

services:
    helios:
        <<: *app
        command: bash -c "python manage.py migrate && python manage.py collectstatic --noinput && /start"
        ports:
            - "80:80"
            - "443:443"
            - 127.0.0.1:8000:8000
        networks:
            - helios-network
        # depends_on:
        #     - db

    celeryworker:
        <<: *celery
        command: /start-celeryworker
        ports:
            - 127.0.0.1:8001:8000
        networks:
            - helios-network

    celerybeat:
        <<: *celery
        command: /start-celerybeat
        ports:
            - 127.0.0.1:8002:8000
        networks:
            - helios-network

    redis:
        image: redis:7.0.10-bullseye
        environment:
            TZ: America/Sao_Paulo
        restart: unless-stopped
        ports:
            - 127.0.0.1:6379:6379
        networks:
            - helios-network
    nginx:
        build:
            dockerfile: ./docker/nginx/Dockerfile
            context: ./
        volumes:
            - ./staticfiles:/var/www/html/static
            - logs_volume:/var/log/nginx
        ports:
            - 1337:80
        # para o redis rodar no mesmo uid e gid do usuário do host, 
        # para evitar problemas de permissão na leitura de staticfiles 
        user: $UID:$GID 
        depends_on:
            - helios
        networks:
            - helios-network
        restart: unless-stopped

    # db:
    #     image: postgres:12.0-alpine
    #     ports:
    #         - 5432:5432
    #     env_file:
    #         - .env
    #     restart: unless-stopped
    #     volumes:
    #         - postgres_volume:/var/lib/postgresql/data/
    #     networks:
    #         - helios-network

networks:
    helios-network:
        driver: bridge

volumes:
    logs_volume:
        driver: local
        driver_opts:
            o: bind
            type: none
            device: ~/docker-volumes/heliosapp/logs
    # postgres_volume:
    #     driver: local
    #     driver_opts:
    #         o: bind
    #         type: none
    #         device: ~/docker-volumes/heliosapp/postgres