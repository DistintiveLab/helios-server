version: '3.7'
services:

  helios:
    build: 
      dockerfile: Dockerfile
      context: .
    ports:
      - 8000
    volumes:
      - ./.:/usr/src/app/
    environment:
      - ALLOWED_HOSTS=['0.0.0.0']
    depends_on:
      - db
    command: >
            sh -c "python manage.py test helios_auth"
  db:
    image: postgres:14.1-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - '5432:5432'