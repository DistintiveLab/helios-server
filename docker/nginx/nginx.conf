upstream helios_app {
    server helios:5000;
}

server {

    listen 80;

    location / {
        proxy_pass http://helios_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location = /favicon.ico { 
        access_log off; 
        log_not_found off; 
        alias /var/www/html/static/favicon.ico;
    }

    location /static {
         alias /var/www/html/static;
    }

    location /media {
         alias /var/www/html/static;
    }

    location /booth {
         alias /var/www/html/static;
    }

    location /verifier {
         alias /var/www/html/static;
    }
}