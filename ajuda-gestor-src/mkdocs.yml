# Para gerar o site estático: mkdocs build
# Para rodar um servidor para testes: mkdocs serve

site_name: Helios - Sistema de votação eletrônica
site_url: https://vote.coletivo.net.br/ajuda-gestor/
site_description: 'Ajuda do sistema de votação eletrônica'
site_author: 'Vote Coletivo'
copyright: 'Copyleft <span class="copyleft">&copy;</span> 2026 - Distintive'

nav:
    - Inicial: index.md
    - Eleitor - como votar: eleitor.md
    - Gestor - Como criar uma eleição: criar.md
    - Gestor - Como iniciar uma eleição: abrir.md
    - Gestor - Como finalizar uma eleição: fechar.md
    - Gestor - Estatísticas: estatisticas.md
    - Gestor - Como gerar chave do apurador: apurador-gerar.md
    - Apurador - Como usar chave do apurador: apurador-usar.md
    - FAQ - Perguntas Frequentes: faq.md

theme:
  name: 'material'
  features:
    - toc.follow
  include_sidebar: true
  custom_dir: 'theme'
  logo: 'assets/images/favicon.png'
  favicon: 'assets/images/favicon.png'
  language: 'pt'
  font:
    text: 'Roboto'
    code: 'Roboto Mono'
  extra:
    platform: github
  search:
    language: 'pt'
  feature:
    navigation.tabs
